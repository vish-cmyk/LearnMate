name: LearnMate CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type-check
        run: npm run lint
      - name: Run progression tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  bun-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from bun.lock
        run: bun install
      - name: Type-check
        run: bun run lint
      - name: Run progression tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
